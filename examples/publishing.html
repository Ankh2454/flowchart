<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>从一页草稿，到正式发布 · 剪纸拼贴流程图</title>
<style>
:root { color-scheme: light; --ink:#203e43; --bg:#edf0e8; --paper:#fffdf4; --orange:#e95b38; --yellow:#efc64a; --teal:#639e95; --loop:6000ms; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
.canvas { width:1440px; height:1000px; margin:0 auto; }
svg { display:block; width:100%; height:100%; }
svg text { fill:var(--ink); }
.headline { font-size:46px; font-weight:650; letter-spacing:1px; }
.eyebrow { font-family:"Avenir Next",Arial,sans-serif; font-size:13px; font-weight:600; letter-spacing:3px; }
.intro { font-size:17px; fill:#586e6c; }
.node-title { font-size:24px; font-weight:650; text-anchor:middle; letter-spacing:1px; }
.node-caption { font-size:16px; fill:#586e6c; text-anchor:middle; }
.edge-label { font-size:16px; font-weight:600; text-anchor:middle; }
.small { font-size:13px; fill:#586e6c; }
.paper { filter:url(#paper-shadow); }
.route { fill:none; stroke-width:10; stroke-linecap:butt; stroke-linejoin:round; }
.ticket { offset-position:0 0; offset-rotate:auto; animation:travel var(--loop) linear infinite; }
.ticket rect { fill:var(--paper); stroke:var(--ink); stroke-width:1.4; }
.ticket path { stroke:var(--ink); stroke-width:1.3; }
.draft-sheet { animation:leaf var(--loop) ease-in-out infinite; transform-origin:200px 480px; }
.stamp { animation:stamp var(--loop) ease-in-out infinite; }
.press-sheet { animation:print var(--loop) ease-in-out infinite; }
.lens { animation:inspect var(--loop) ease-in-out infinite; transform-origin:844px 682px; }
.seal { animation:seal var(--loop) ease-in-out infinite; transform-origin:1262px 507px; }
@keyframes travel { 0% { offset-distance:0%; opacity:0; } 5% { opacity:1; } 91% { opacity:1; } 97%,100% { offset-distance:100%; opacity:0; } }
@keyframes leaf { 0%,12%,40%,100% { transform:translateY(0) rotate(0); } 24% { transform:translateY(-5px) rotate(-1.2deg); } }
@keyframes stamp { 0%,25%,52%,100% { transform:translateY(0); } 35%,41% { transform:translateY(12px); } }
@keyframes print { 0%,44%,88%,100% { transform:translateY(0); } 62%,72% { transform:translateY(9px); } }
@keyframes inspect { 0%,42%,90%,100% { transform:translate(0,0) rotate(0); } 60%,72% { transform:translate(-7px,3px) rotate(-5deg); } }
@keyframes seal { 0%,68%,96%,100% { transform:scale(1); } 78% { transform:scale(1.06); } }
body.paused svg * { animation-play-state:paused!important; }
.controls { position:fixed; right:20px; bottom:18px; display:flex; align-items:center; gap:12px; padding:9px 12px; border:1px solid #cad3c7; border-radius:4px; background:#fffdf4ed; font-size:12px; color:#586e6c; }
button { border:0; padding:7px 10px; color:var(--paper); background:var(--ink); font:inherit; cursor:pointer; border-radius:2px; }
button:focus-visible { outline:3px solid var(--orange); outline-offset:3px; }
body.export .controls { display:none; }
@media(max-width:1439px) { .canvas { width:100%; height:auto; aspect-ratio:1440/1000; } }
@media(prefers-reduced-motion:reduce) { svg * { animation:none!important; } .ticket { display:none; } }
@media print { .controls { display:none; } svg * { animation:none!important; } .ticket { display:none; } }
</style>
</head>
<body>
<main class="canvas">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">从一页草稿，到正式发布</title>
<desc id="diagram-description">剪纸拼贴风格的文档发布流程。草稿输入后进行内容校验；满足规范则自动发布，再到发布完成。需要确认时转人工复核；人工确认后发布完成，需修改时返回内容校验。所有箭头均表示文档的真实流向。</desc>
<defs>

    <feDropShadow dx="2" dy="4" stdDeviation="1.2" flood-color="#203e43" flood-opacity=".18"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".66" numOctaves="3" stitchTiles="stitch" seed="12"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <marker id="orange-arrow" viewBox="0 0 20 22" refX="18" refY="11" markerWidth="20" markerHeight="22" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 20 11 0 22 5 11Z" fill="#e95b38"/></marker>
  <marker id="teal-arrow" viewBox="0 0 20 22" refX="18" refY="11" markerWidth="20" markerHeight="22" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 20 11 0 22 5 11Z" fill="#639e95"/></marker>
  <marker id="return-arrow" viewBox="0 0 18 20" refX="17" refY="10" markerWidth="18" markerHeight="20" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 18 10 0 20 4 10Z" fill="#889b91"/></marker>
  <g id="ticket-shape"><path d="M-12-9H7L12-4V9H-12Z" fill="#fffdf4" stroke="#203e43" stroke-width="1.2"/><path d="M7-9V-4H12M-7-2H3M-7 3H6" fill="none" stroke="#203e43" stroke-width="1.2"/></g>
  <clipPath id="print-window"><rect x="772" y="221" width="150" height="141"/></clipPath>
</defs>
<rect width="1440" height="1000" fill="#edf0e8"/>

<!-- Quiet editorial framing; the objects carry the style. -->
<g aria-hidden="true">
  <path d="M80 50H100V70H80Z" fill="#e95b38"/>
  <path d="M96 50H101V55Z" fill="#203e43"/>
  <text x="114" y="65" class="eyebrow">FLOWCHART / PAPER CUT</text>
  <text x="1358" y="65" text-anchor="end" class="small">剪纸拼贴 · 文档发布流程</text>
  <text x="78" y="132" class="headline">从一页草稿，到正式发布</text>
  <text x="80" y="174" class="intro">让规则处理确定的事，让人判断需要斟酌的事。</text>
  <path d="M80 208H1360" stroke="#c9d1c6"/>
</g>

  <g class="ticket" style="offset-path:path('M290 463H395');animation-delay:-600ms"><use href="#ticket-shape"/></g>
  <g class="ticket" style="offset-path:path('M576 439H595C633 439 615 318 658 318H745');animation-delay:-1600ms"><use href="#ticket-shape"/></g>
  <g class="ticket" style="offset-path:path('M951 318H1025Q1069 318 1069 362V399Q1069 438 1107 438H1124');animation-delay:-3000ms"><use href="#ticket-shape"/></g>
  <g class="ticket" style="offset-path:path('M576 490H594C638 490 611 681 669 681H747');animation-delay:-700ms"><use href="#ticket-shape"/></g>
  <g class="ticket" style="offset-path:path('M947 681H1025Q1069 681 1069 637V536Q1069 493 1110 493H1124');animation-delay:-3400ms"><use href="#ticket-shape"/></g>
  <g class="ticket" style="offset-path:path('M770 727H753Q714 727 714 766V802Q714 832 684 832H375Q345 832 345 802V550Q345 521 374 521H398');animation-delay:-2300ms"><use href="#ticket-shape"/></g>
</g>

  <path d="M80 918H1360" stroke="#c9d1c6"/>

</svg>
</main>
<div class="controls" data-preview-controls><span>6 秒循环</span><button id="motion" type="button" aria-pressed="false">暂停动画</button></div>
<script>
const button = document.getElementById('motion');
if (new URLSearchParams(location.search).has('export')) document.body.classList.add('export');
const media = matchMedia('(prefers-reduced-motion: reduce)');
function syncMotionControl() {
  button.disabled = media.matches;
  const paused = document.body.classList.contains('paused');
  button.textContent = media.matches ? '已减少动态效果' : paused ? '播放动画' : '暂停动画';
  button.setAttribute('aria-pressed', String(paused));
}
media.addEventListener('change', syncMotionControl);
syncMotionControl();
button.addEventListener('click', () => {
  const paused = document.body.classList.toggle('paused');
  button.setAttribute('aria-pressed', String(paused));
  button.textContent = paused ? '播放动画' : '暂停动画';
});
</script>
</body>
</html>
